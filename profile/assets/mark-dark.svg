<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes orbit-draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    @keyframes logo-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
    .orbit { stroke-dasharray: 400; stroke-dashoffset: 400; animation: orbit-draw 3s ease-out forwards; }
    .orbit-2 { animation-delay: .4s; }
    .star { transform-origin: 50% 50%; animation: logo-pulse 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .orbit { animation: none; stroke-dashoffset: 0; }
      .star { animation: none; }
    }
  </style>
  <ellipse class="orbit" cx="64" cy="68" rx="60" ry="24" stroke="white" stroke-width="2.5" transform="rotate(-15, 64, 68)" />
  <ellipse class="orbit orbit-2" cx="64" cy="68" rx="60" ry="24" stroke="white" stroke-width="2.5" transform="rotate(15, 64, 68)" />
